on:
  push:
    branches:
      - main

jobs:
  hello_world_job:
    runs-on: ubuntu-latest

    steps:
      - name: Hello world action step
        id: hello
        uses: Darika-git/hello-world-javascript-action@main
        with:
          who-to-greet: Darika

      - name: Get output time
        run: echo "The time was ${{ steps.hello.outputs.time }}"